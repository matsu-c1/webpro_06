<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
</head>
<body>
    <form action="/keiyo2" method="POST">
    <label>駅コード：</label>
    <input type="text" name="code" required><br>

    <label>駅名：</label>
    <input type="text" name="name" required><br>

    <label>乗り換え線：</label>
    <input type="text" name="change"><br>

    <label>乗降客数：</label>
    <input type="text" name="passengers" required><br>

    <label>東京駅からの距離：</label>
    <input type="text" name="distance" required><br>

    <input type="submit" value="登録">
</form>

</body>
</html>
