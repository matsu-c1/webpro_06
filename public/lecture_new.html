<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>講義 新規登録</title>
</head>
<body>

<h2>講義 新規登録</h2>

<form action="/lecture" method="POST">
  <table>
    <tr>
      <th>講義名</th>
      <td><input type="text" name="title" required></td>
    </tr>
    <tr>
      <th>担当教員</th>
      <td><input type="text" name="teacher" required></td>
    </tr>
    <tr>
      <th>曜日・時限</th>
      <td><input type="text" name="day" required></td>
    </tr>
    <tr>
      <th>教室</th>
      <td><input type="text" name="room" required></td>
    </tr>
    <tr>
      <th>単位数</th>
      <td><input type="text" name="credit" required></td>
    </tr>
  </table>

  <input type="submit" value="登録">
</form>

<a href="/lecture">一覧に戻る</a>

</body>
</html>
