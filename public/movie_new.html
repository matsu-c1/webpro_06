<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>映画 新規登録</title>
</head>
<body>

<h2>映画 新規登録</h2>

<form action="/movie" method="POST">
  <table>
    <tr>
      <th>タイトル</th>
      <td><input type="text" name="title" required></td>
    </tr>
    <tr>
      <th>監督</th>
      <td><input type="text" name="director" required></td>
    </tr>
    <tr>
      <th>ジャンル</th>
      <td><input type="text" name="genre"></td>
    </tr>
    <tr>
      <th>公開年</th>
      <td><input type="text" name="year" required></td>
    </tr>
    <tr>
      <th>上映時間（分）</th>
      <td><input type="text" name="length" required></td>
    </tr>
  </table>

  <input type="submit" value="登録">
</form>

<a href="/movie">一覧に戻る</a>

</body>
</html>
